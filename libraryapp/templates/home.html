<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>
</head>
<body>

<h1>Library Management System</h1>

<h2>Available Books</h2>

<table border="1">
<tr>
<th>Title</th>
<th>Author</th>
<th>Status</th>
</tr>

{% for book in books %}
<tr>
<td>{{ book.title }}</td>
<td>{{ book.author }}</td>
<td>
{% if book.available %}
Available
{% else %}
Not Available
{% endif %}
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
